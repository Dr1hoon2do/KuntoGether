<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>KuntoGether - 컨트롤러</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #pad{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;left:0;right:0;top:0;padding:8px 12px;display:flex;justify-content:space-between;font-size:15px;pointer-events:none;text-shadow:0 0 4px #000}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;background:#000a;pointer-events:none;white-space:pre-line}
  #msg.hide{display:none}
</style>
</head>
<body>
<canvas id="pad"></canvas>
<div id="hud"><span id="hp"></span><span id="score"></span></div>
<div id="msg">연결 중...</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="shared/room.js"></script>
<script>
const $ = id => document.getElementById(id);
const code = normalizeCode(new URLSearchParams(location.search).get("join") || "");
const msg = t => { $("msg").textContent = t || ""; $("msg").classList.toggle("hide", !t); };

// ---------- 조작: 왼쪽 = 이동 스틱, 오른쪽 아무 데나 = 공격(누른 채 드래그하면 그 방향으로), 오른쪽 아래 버튼 = 대시 ----------
const cv = $("pad"), g = cv.getContext("2d"), R = 55; // 스틱 최대 반경(px)
const sticks = { move: null, aim: null }; // { id, ox, oy, x, y }
let dashPtr = null, color = "#4fc3f7", weapon = "";
const dashBtn = () => ({ x: innerWidth - 70, y: innerHeight - 70, r: 42 });
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); draw(); }
addEventListener("resize", resize);

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  const d = dashBtn();
  if (dashPtr === null && Math.hypot(e.clientX - d.x, e.clientY - d.y) < d.r + 10) { dashPtr = e.pointerId; draw(); return; }
  const k = e.clientX < innerWidth / 2 ? "move" : "aim";
  if (sticks[k]) return;
  sticks[k] = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
  draw();
});
cv.addEventListener("pointermove", e => {
  for (const s of Object.values(sticks)) if (s && s.id === e.pointerId) { s.x = e.clientX; s.y = e.clientY; }
  draw();
});
const end = e => {
  for (const k in sticks) if (sticks[k] && sticks[k].id === e.pointerId) sticks[k] = null;
  if (dashPtr === e.pointerId) dashPtr = null;
  draw();
};
cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);

const vec = s => {
  if (!s) return [0, 0];
  let dx = (s.x - s.ox) / R, dy = -(s.y - s.oy) / R; // 화면 Y-down → 월드 Y-up
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  return [dx, dy];
};
function draw() {
  g.clearRect(0, 0, innerWidth, innerHeight);
  g.strokeStyle = "#ffffff18"; g.beginPath(); g.moveTo(innerWidth / 2, 0); g.lineTo(innerWidth / 2, innerHeight); g.stroke();
  g.fillStyle = "#ffffff30"; g.font = "14px sans-serif"; g.textAlign = "center";
  g.fillText("이동", innerWidth / 4, innerHeight - 20); g.fillText("터치 = 공격 (드래그로 방향)", innerWidth * 3 / 4 - 40, innerHeight - 20);
  const d = dashBtn();
  g.fillStyle = dashPtr !== null ? color + "cc" : color + "44"; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill();
  g.strokeStyle = color; g.lineWidth = 2; g.stroke(); g.fillStyle = "#fff"; g.fillText("대시", d.x, d.y + 5);
  for (const [k, s] of Object.entries(sticks)) if (s) {
    g.strokeStyle = k === "aim" ? "#ff8a65" : color; g.lineWidth = 2; g.beginPath(); g.arc(s.ox, s.oy, R, 0, 7); g.stroke();
    const l = Math.hypot(s.x - s.ox, s.y - s.oy) || 1, m = Math.min(l, R);
    g.fillStyle = (k === "aim" ? "#ff8a65" : color) + "aa"; g.beginPath(); g.arc(s.ox + (s.x - s.ox) / l * m, s.oy + (s.y - s.oy) / l * m, 24, 0, 7); g.fill();
  }
}

// ---------- 연결 ----------
if (!code) { msg("방 코드가 없습니다.\n처음 화면에서 입력해 주세요."); }
else {
  // 단계별로 상태를 보여 줘서 어디서 막혔는지 알 수 있게 한다
  msg("1/3 서버에 접속 중...");
  const peer = new Peer(undefined, PEER_OPTIONS);
  const fail = t => { if (!$("msg").classList.contains("hide")) msg(t); };
  const serverTimer = setTimeout(() => fail("서버에 접속하지 못했어요.\n(PeerJS 서버 연결 실패 — 네트워크/차단 확인)"), 10000);
  peer.on("error", e => msg(e.type === "peer-unavailable" ? "방을 찾을 수 없어요.\n코드를 다시 확인해 주세요." : e.type === "negotiation-failed" ? "TV와 연결 경로를 못 찾았어요.\n(네트워크가 서로 달라 막힌 경우예요 — 같은 와이파이로 다시 시도)" : "에러: " + e.type + "\n" + (e.message || "")));
  peer.on("open", () => {
    clearTimeout(serverTimer);
    msg("2/3 TV를 찾는 중...");
    const c = peer.connect(codeToPeerId(code), { reliable: true, serialization: "json" }) // iOS Safari는 binary 직렬화(기본값)에서 문제가 있어 json 사용;
    const rtcTimer = setTimeout(() => fail("TV와 직접 연결하지 못했어요.\n(서로 다른 네트워크이면 막힐 수 있어요 — 같은 와이파이로 시도)"), 15000);
    c.on("error", e => msg("연결 에러: " + (e.type || e)));
    let timer = 0, last = "";
    c.on("open", () => {
      clearTimeout(rtcTimer);
      msg("");
      timer = setInterval(() => {
        const [mx, my] = vec(sticks.move), [ax, ay] = vec(sticks.aim);
        const out = JSON.stringify({ t: "s", mx: +mx.toFixed(2), my: +my.toFixed(2), ax: +ax.toFixed(2), ay: +ay.toFixed(2), atk: sticks.aim ? 1 : 0, dash: dashPtr !== null ? 1 : 0 });
        if (out !== last) { c.send(JSON.parse(out)); last = out; }
      }, 33);
    });
    let prevHp = null;
    c.on("data", d => {
      if (d.t === "welcome") { color = d.color; draw(); }
      else if (d.t === "st") {
        $("hp").textContent = d.alive ? "♥".repeat(d.hp) + "♡".repeat(d.maxHp - d.hp) : "💀 다음 방에서 부활";
        $("score").textContent = `ROOM ${d.room} · ${d.weapon} · 처치 ${d.kills}`;
        if (prevHp !== null && d.hp < prevHp && navigator.vibrate) navigator.vibrate(120);
        prevHp = d.hp;
      }
    });
    c.on("close", () => { clearInterval(timer); msg("연결이 끊겼어요.\n새로고침하면 다시 접속해요."); });
  });
}
resize();
</script>
</body>
</html>
