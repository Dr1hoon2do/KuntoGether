<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KuntoGether</title>
<style>
  body{margin:0;font-family:sans-serif;background:#111;color:#eee;padding:16px;max-width:520px}
  h2{margin:8px 0 4px}
  .game{background:#1b1f25;border-radius:12px;padding:14px;margin:14px 0}
  .game h3{margin:0 0 2px}
  .game p{margin:0 0 8px}
  a.btn,button{display:block;box-sizing:border-box;text-align:center;text-decoration:none;font-size:17px;padding:12px 16px;margin:6px 0;width:100%;border:0;border-radius:8px;background:#3a7;color:#fff}
  button{background:#47a}
  input{font-size:22px;padding:10px;width:100%;box-sizing:border-box;border-radius:8px;border:0;margin:6px 0;text-align:center;letter-spacing:6px;text-transform:uppercase}
  p{color:#789;font-size:14px}
</style>
</head>
<body>
<h2>KuntoGether</h2>
<p>TV(또는 PC) 브라우저에서 게임을 열고, 폰은 컨트롤러로 접속해요.</p>

<div class="game">
  <h3>🎉 파티 (미니게임 모음)</h3>
  <p>한 화면을 같이 보며 하는 짧은 미니게임들. 폰은 컨트롤러 전용.</p>
  <a class="btn" href="party/tv.html">📺 TV에서 열기</a>
  <input id="pcode" placeholder="방 코드" maxlength="8" autocapitalize="characters" autocomplete="off">
  <button data-game="party">📱 폰으로 접속</button>
</div>

<div class="game">
  <h3>⚔️ 던전 (협동 로그라이크)</h3>
  <p>2~4인 탑다운 던전. 아이작 + 소울나이트 느낌.</p>
  <a class="btn" href="dungeon/tv.html">📺 TV에서 열기</a>
  <input id="dcode" placeholder="방 코드" maxlength="8" autocapitalize="characters" autocomplete="off">
  <button data-game="dungeon">📱 폰으로 접속</button>
</div>

<script src="shared/room.js"></script>
<script>
const PAD = { party: "party/pad.html", dungeon: "dungeon/pad.html" };
const IN = { party: "pcode", dungeon: "dcode" };
const go = (g, c) => location.href = PAD[g] + "?join=" + c;
const q = new URLSearchParams(location.search).get("join");
if (q) go("dungeon", normalizeCode(q)); // 예전 링크(?join=코드)는 던전으로
for (const b of document.querySelectorAll("button[data-game]")) b.onclick = () => {
  const g = b.dataset.game, el = document.getElementById(IN[g]), c = normalizeCode(el.value);
  if (c.length === CODE_LEN) go(g, c); else el.focus();
};
</script>
</body>
</html>
