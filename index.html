<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KuntoGether</title>
<style>
  body{margin:0;font-family:sans-serif;background:#111;color:#eee;padding:16px;max-width:480px}
  button,a.btn{display:block;box-sizing:border-box;text-align:center;text-decoration:none;font-size:18px;padding:14px 20px;margin:6px 0;width:100%;border:0;border-radius:8px;background:#3a7;color:#fff}
  input{font-size:24px;padding:12px;width:100%;box-sizing:border-box;border-radius:8px;border:0;margin:6px 0;text-align:center;letter-spacing:6px;text-transform:uppercase}
  p{color:#789;font-size:14px}
</style>
</head>
<body>
<h2>KuntoGether</h2>
<a class="btn" href="tv.html">📺 TV에서 게임 열기 (호스트)</a>
<p>TV 브라우저에서 위 버튼을 누르면 방 코드가 나와요.</p>
<input id="code" placeholder="방 코드" maxlength="8" autocapitalize="characters" autocomplete="off">
<button id="join" style="background:#47a">📱 폰으로 접속 (컨트롤러)</button>
<script src="shared/room.js"></script>
<script>
const go = c => location.href = "pad.html?join=" + c;
const q = new URLSearchParams(location.search).get("join");
if (q) go(normalizeCode(q)); // 예전 링크(?join=코드) 호환
document.getElementById("join").onclick = () => {
  const c = normalizeCode(document.getElementById("code").value);
  if (c.length === CODE_LEN) go(c); else document.getElementById("code").focus();
};
</script>
</body>
</html>
